name: Verify LectureMate
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and tests
        run: |
          node -e "const m=require('./extension/manifest.json');if(m.background.service_worker || !m.background.scripts || !m.host_permissions.includes('http://127.0.0.1/*'))process.exit(1)"
          node --check extension/background.js
          node --check extension/transcript.js
          node --check extension/content.js
          node --check server/server.js
          node --test tests/server.test.js tests/transcript.test.js
      - name: Build and check Safari userscript
        run: |
          node scripts/build-userscript.js
          node --check dist/LectureMate.user.js
          git diff --exit-code -- dist/LectureMate.user.js dist/LectureMate.meta.js
