name: Bootstrap LectureMate sources
on:
  push:
    paths:
      - '.bootstrap/lecturemate.tar.xz'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Unpack sources and run checks
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf .bootstrap/lecturemate.tar.xz --strip-components=1
          rm -rf .bootstrap
          node --check extension/content.js
          node --check extension/background.js
          node --check server/server.js
          node --test tests/server.test.js
          node scripts/build-userscript.js
          git diff --exit-code -- dist/LectureMate.user.js
      - name: Publish source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Extract LectureMate Safari extension and tutor server'
          git push origin HEAD:main
